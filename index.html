<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Suhu</title>
    <link rel="stylesheet" href="css/style.css">                                <!--link css-->
    <script defer src="js/script.js"></script>                                  <!--link js-->
</head>

<header>                                                                        <!--NAVBAR-->
    <div class="navbar"></div>
</header>

<body>
    <section>
        <div class="main-area">                                                 <!--area konten-->                  
            <div class="title-area">Kalkulator Suhu</div>                       <!--judul-->
            Masukkan suhu derajat Celsius (C) ke kotak dibawah, lalu klik tombol konversi untuk mendapatkan hasil 
            konversi dalam bentuk Farenheit (F).
            <div class="area-hitung">
                <div class="area-input">
                    <h3>INPUT :</h3>
                    <div class="dropdown">
                        <button class="dropbtn">Dropdown</button>
                        <div class="dropdown-content">
                            <a href="#">Celsius</a>
                            <a href="#">Farenheit</a>
                        </div>
                    </div>
                    <div class="area-input-field">
                        <input type="number" class="input">
                        <div class="area-input-corner"></div>
                        <div class="area-input-field-satuan">C</div>
                        72
                    </div>
                </div>
                <div class="area-hasil">
                    <h3>HASIL :</h3>
                    <div class="dropdown">
                        <button class="dropbtn">Dropdown</button>
                        <div class="dropdown-content">
                            <a href="#">Celsius</a>
                            <a href="#">Farenheit</a>
                        </div>
                    </div>
                    <div class="area-hasil-field">
                        <input type="number" class="hasil">
                        <div class="area-hasil-corner"></div>
                        <div class="area-hasil-field-satuan">F</div>
                        72
                    </div>
                </div>
            </div>
            <div class="area-button">
                <button class="button">Konversi</button>
                <button class="button">Reset</button>
                <button class="button" style="margin-right: 0;">Reverse</button>
            </div>
            <div class="area-cara">
                <h3>CARA KALKULASI :</h3>
                <div class="area-cara-field">
                    <input type="text" class="cara">
                </div>
            </div>
        </div>
    </section>
</body>

<footer>
    <div class="footer">
        test
    </div>
</footer>

</html>
